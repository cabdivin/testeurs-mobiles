# Production iOS build of a Cabdivin app on a hosted Mac with `eas build --local`, optional TestFlight upload.
# The logs of a public repo are public: every tool output is written to files, encrypted with
# results_public.pem, and uploaded as an artifact (never the .ipa).
# Decrypt with: bash scripts/collecter-build.sh <run id> <folder>
name: Build iOS

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        type: choice
        options: [pro, patient]
        default: pro
      ref:
        description: Branch or SHA of the app source
        default: develop
      envoyer:
        description: "Upload the .ipa to TestFlight (oui / non; refused with qa-simulateur)"
        type: choice
        options: ["non", "oui"]
        default: "non"
      profil:
        description: "production (signed .ipa) or qa-simulateur (Simulator .app with the QA session route, for captures-ios.yml)"
        type: choice
        options: [production, qa-simulateur]
        default: production

permissions:
  contents: read

concurrency:
  group: build-ios-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        run: test -s results_public.pem || { echo "::error::results_public.pem is missing"; exit 1; }
      - name: Latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version | head -1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        env:
          APP: ${{ inputs.app }}
          REF: ${{ inputs.ref }}
          ENVOYER: ${{ inputs.envoyer }}
          PROFIL: ${{ inputs.profil }}
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OMNICAB_DEPLOY_KEY: ${{ secrets.OMNICAB_DEPLOY_KEY }}
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_B64: ${{ inputs.app == 'pro' && secrets.IOS_PROFILE_PRO_B64 || secrets.IOS_PROFILE_PATIENT_B64 }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: bash scripts/ios/build-release.sh
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/sign" "$RUNNER_TEMP/omnicab" "$RUNNER_TEMP/out" "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/eas-work"
      - name: Encrypt logs
        if: always()
        run: bash scripts/encrypt_results.sh "build-ios-${{ inputs.app }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "results-build-ios-${{ inputs.app }}"
          path: results.enc/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && inputs.profil == 'qa-simulateur'
        with:
          name: "app-simulateur-${{ inputs.app }}"
          path: app-out/app-ios.tgz.enc
          retention-days: 3
